name: Manual release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name to publish, for example 0.3.0
        required: true
        type: string
      version_code:
        description: Optional integer version code override
        required: false
        type: string
      tag_name:
        description: Release tag; defaults to v<version_name> when blank
        required: false
        type: string
      prerelease:
        description: Mark GitHub release as prerelease
        required: true
        default: true
        type: boolean
      generate_notes:
        description: Generate GitHub release notes
        required: true
        default: true
        type: boolean
      release_title:
        description: Optional release title
        required: false
        type: string
      release_body:
        description: Optional release body
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Resolve Gradle version metadata
        run: |
          set -euo pipefail
          if [ -z "${VERSION_CODE}" ]; then
            IFS=. read -r major minor patch extra <<< "${VERSION_NAME}"
            major="${major:-0}"
            minor="${minor:-0}"
            patch="${patch:-0}"
            if [ -n "${extra:-}" ]; then
              echo "version_name must be numeric dotted form when version_code is omitted" >&2
              exit 1
            fi
            case "$major$minor$patch" in (*[!0-9]*) echo "version_name must be numeric dotted form when version_code is omitted" >&2; exit 1;; esac
            VERSION_CODE=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          fi
          case "$VERSION_CODE" in (*[!0-9]*|'') echo "VERSION_CODE must be a positive integer" >&2; exit 1;; esac
          if [ "$VERSION_CODE" -le 0 ]; then echo "VERSION_CODE must be greater than zero" >&2; exit 1; fi
          printf 'VERSION_CODE=%s\n' "$VERSION_CODE" >> "$GITHUB_ENV"
          printf 'Resolved VERSION_NAME=%s VERSION_CODE=%s\n' "$VERSION_NAME" "$VERSION_CODE"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build, test, and lint release candidate
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then GRADLE=./gradlew; else GRADLE=gradle; fi
          "$GRADLE" clean test assembleRelease lint --no-daemon
          bash -n scripts/*.sh
      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find app/build/outputs/apk/release -name '*.apk' -print -exec cp {} release-artifacts/ \;
          find app/build/outputs/mapping app/build/reports -type f \( -name 'mapping.txt' -o -name '*.html' -o -name '*.xml' \) -exec cp --parents {} release-artifacts/ \; || true
          apk_count=$(find release-artifacts -type f -name '*.apk' | wc -l)
          if [ "$apk_count" -eq 0 ]; then
            echo 'No release APK was produced.' >&2
            exit 1
          fi
          (cd release-artifacts && find . -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          if find release-artifacts -name '*unsigned*.apk' -o -name '*release*.apk' | grep -q .; then
            printf 'Release APKs are unsigned unless repository signing configuration and secrets are added. Future signing secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.\n' > release-artifacts/ARTIFACT_NOTICE.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ts18-intent-bridge-release-candidate
          path: release-artifacts
      - name: Resolve release metadata
        id: meta
        run: |
          tag='${{ inputs.tag_name }}'
          if [ -z "$tag" ]; then tag="v${{ inputs.version_name }}"; fi
          title='${{ inputs.release_title }}'
          if [ -z "$title" ]; then title="TS18 Intent Bridge $tag"; fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'title=%s\n' "$title" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: ${{ inputs.release_body }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.generate_notes }}
          files: release-artifacts/**
