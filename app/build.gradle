plugins { id "com.android.application" }

android {
    buildFeatures {
        buildConfig true
    }

    namespace "dev.cbkii.ts18intentbridge"
    compileSdk 35

    defaultConfig {
        applicationId "dev.cbkii.ts18intentbridge"
        minSdk 29
        targetSdk 29
        def envVersionCode = System.getenv("VERSION_CODE")
        def envVersionName = System.getenv("VERSION_NAME")
        versionCode ((envVersionCode == null || envVersionCode.trim().isEmpty()) ? 2 : envVersionCode.trim().toInteger())
        versionName ((envVersionName == null || envVersionName.trim().isEmpty()) ? "0.2.0-dev" : envVersionName.trim())
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // Legacy Xposed API is compile-only. Vector/JingMatrix supports legacy and modern module compatibility.
    compileOnly "de.robv.android.xposed:api:82"
    testCompileOnly "de.robv.android.xposed:api:82"
    testImplementation "junit:junit:4.13.2"
}
